<app-modal [isOpen]="!!options" 
           [title]="options?.title || ''" 
           [size]="'sm'" 
           (close)="onCancel()">
  
  <div class="p-1">
    <p class="mb-0 text-muted">{{ options?.message }}</p>
  </div>

  <div modal-footer>
    <button type="button" class="btn btn-light rounded-3 px-4 fw-bold" (click)="onCancel()">
      {{ options?.cancelText || 'Annuler' }}
    </button>
    <button type="button" class="btn rounded-3 px-4 fw-bold shadow-sm" 
            [ngClass]="options?.type === 'danger' ? 'btn-danger' : 'btn-primary-indigo'"
            (click)="onConfirm()">
      {{ options?.confirmText || 'Confirmer' }}
    </button>
  </div>
</app-modal>
